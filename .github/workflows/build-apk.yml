name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o RizovSoundScale-Android-Project.zip -d project

      - name: Build APK
        run: |
          cd project/RizovSoundScale
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Rizov-Sound-Scale-APK
          path: project/RizovSoundScale/app/build/outputs/apk/debug/*.apk
